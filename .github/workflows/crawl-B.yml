name: crawl-B

on:
  workflow_dispatch:
    inputs:
      note:
        description: '由 cron-job.org 定时触发（北京时间 09:20 / 12:55，周一至五）'
        required: false
        default: ''

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run collector (Agent B, phase 4s)
        env:
          REPORT_ENDPOINT: ${{ secrets.REPORT_ENDPOINT }}
          SECRET_TOKEN: ${{ secrets.SECRET_TOKEN }}
          PHASE_OFFSET: '4'
          AGENT_ID: 'B'
        run: node collect.mjs
