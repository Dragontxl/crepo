name: crawl-A

on:
  workflow_dispatch:
    inputs:
      note:
        description: '由 cron-job.org 定时触发（北京时间 09:20 / 12:55，周一至五）'
        required: false
        default: ''
      force:
        description: '强制模式（1=跳过时段检查跑一轮）'
        required: false
        default: ''

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run collector (Agent A, phase 0s)
        env:
          REPORT_ENDPOINT: ${{ secrets.REPORT_ENDPOINT }}
          SECRET_TOKEN: ${{ secrets.SECRET_TOKEN }}
          PHASE_OFFSET: '0'
          AGENT_ID: 'A'
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_S3_ACCESS_KEY_ID: ${{ secrets.R2_S3_ACCESS_KEY_ID }}
          R2_S3_SECRET_ACCESS_KEY: ${{ secrets.R2_S3_SECRET_ACCESS_KEY }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          FORCE: ${{ github.event.inputs.force || '0' }}
        run: node collect.mjs
